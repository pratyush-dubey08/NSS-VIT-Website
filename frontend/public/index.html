<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>NSS VIT Bhopal</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #0A192F;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
    }
    .logo {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background: #ffffff;
      padding: 8px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.4);
      animation: pulse 2s infinite;
    }
    h1 {
      font-size: 1.25rem;
      font-weight: 800;
      margin-top: 1.5rem;
      letter-spacing: -0.5px;
    }
    p {
      color: #94A3B8;
      font-size: 0.85rem;
      margin-top: 0.5rem;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }
  </style>
  <script>
    window.location.href = "https://nss-vit-website.onrender.com";
  </script>
</head>
<body>
  <img src="images/nss-logo.png" alt="NSS Logo" class="logo">
  <h1>NSS Unit, VIT Bhopal University</h1>
  <p>Connecting to Live Volunteer Portal...</p>
</body>
</html>
