name: Build Android APK & App Bundle

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android App (APK & AAB)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm install --legacy-peer-deps

      - name: Install Android Platform 35 and Accept Licenses
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0" || true

      - name: Configure Android SDK
        working-directory: frontend/android
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          cat local.properties

      - name: Grant execute permission for gradlew
        working-directory: frontend/android
        run: chmod +x gradlew

      - name: Build Debug APK
        working-directory: frontend/android
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Discover and Copy APK
        working-directory: frontend/android
        run: |
          mkdir -p ../../build-artifacts
          mkdir -p ../public/downloads
          echo "=== FINDING ALL .APK FILES ==="
          find . -name "*.apk"
          APK=$(find . -name "*.apk" | head -n 1)
          if [ -n "$APK" ]; then
            echo "Copying $APK"
            cp -v "$APK" ../../build-artifacts/nss-vit-v1.1.apk
            cp -v "$APK" ../../build-artifacts/nss-vit-bhopal.apk
            cp -v "$APK" ../public/downloads/nss-vit-v1.1.apk
            cp -v "$APK" ../public/downloads/nss-vit-bhopal.apk
            ls -lh ../../build-artifacts/
            ls -lh ../public/downloads/
          else
            echo "No APK found"
            exit 1
          fi

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nss-vit-v1.1-apk
          path: build-artifacts/nss-vit-v1.1.apk

      - name: Publish GitHub Release via GitHub CLI
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload v1.0.0 build-artifacts/nss-vit-v1.1.apk build-artifacts/nss-vit-bhopal.apk --clobber || true
          gh release create v1.1.0 build-artifacts/nss-vit-v1.1.apk build-artifacts/nss-vit-bhopal.apk \
            --title "NSS VIT Official Android App v1.1" \
            --notes "Official Android Mobile Application for NSS Unit, VIT Bhopal University." \
            --clobber || gh release upload v1.1.0 build-artifacts/nss-vit-v1.1.apk build-artifacts/nss-vit-bhopal.apk --clobber
