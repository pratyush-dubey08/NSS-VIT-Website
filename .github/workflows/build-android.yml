name: Build Android APK & App Bundle

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android App (APK & AAB)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm install

      - name: Sync Capacitor Android
        working-directory: frontend
        run: npx cap sync android

      - name: Grant execute permission for gradlew
        working-directory: frontend/android
        run: chmod +x gradlew

      - name: Build Debug APK
        working-directory: frontend/android
        run: ./gradlew assembleDebug --stacktrace

      - name: Build Release Bundle (AAB for Play Store)
        working-directory: frontend/android
        run: ./gradlew bundleRelease --stacktrace

      - name: Prepare Artifacts
        run: |
          mkdir -p build-artifacts
          cp frontend/android/app/build/outputs/apk/debug/app-debug.apk build-artifacts/nss-vit-bhopal.apk
          find frontend/android/app/build/outputs/ -name "*.aab" -exec cp {} build-artifacts/nss-vit-bhopal.aab \; || true

      - name: Upload APK and AAB as Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nss-vit-bhopal-android-packages
          path: build-artifacts/

      - name: Create or Update GitHub Release with Direct APK Download
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v1.0.0
          name: NSS VIT Bhopal Official Android App v1.0.0
          body: |
            Official Android Mobile Application for National Service Scheme (NSS), VIT Bhopal University.
            
            ### 📱 Download & Install:
            - **Direct APK**: Download `nss-vit-bhopal.apk` on your Android phone and install.
            - **Play Store Bundle**: `nss-vit-bhopal.aab` for Google Play Console submission.
          files: |
            build-artifacts/nss-vit-bhopal.apk
            build-artifacts/nss-vit-bhopal.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
