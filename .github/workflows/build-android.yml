name: Build Android APK & App Bundle

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android App (APK & AAB)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm install --legacy-peer-deps

      - name: Install Android Platform 35 and Accept Licenses
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0" || true

      - name: Configure Android SDK
        working-directory: frontend/android
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          cat local.properties

      - name: Grant execute permission for gradlew
        working-directory: frontend/android
        run: chmod +x gradlew

      - name: Build Debug APK
        working-directory: frontend/android
        run: |
          ./gradlew assembleDebug --stacktrace --no-daemon 2>&1 | tee /tmp/gradle.log || (tail -n 100 /tmp/gradle.log && exit 1)

      - name: Prepare Artifacts and Commit to Website Downloads
        run: |
          mkdir -p build-artifacts
          mkdir -p frontend/public/downloads
          cp -v frontend/android/app/build/outputs/apk/debug/app-debug.apk build-artifacts/nss-vit-bhopal.apk
          cp -v build-artifacts/nss-vit-bhopal.apk frontend/public/downloads/nss-vit-bhopal.apk
          ls -lh build-artifacts/
          ls -lh frontend/public/downloads/

      - name: Commit APK to Website Public Downloads
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -f frontend/public/downloads/nss-vit-bhopal.apk
          git commit -m "Auto-publish compiled Android APK v1.0.0 to website downloads [skip ci]" || echo "No changes to commit"
          git push origin main || echo "Failed to push to main"

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nss-vit-bhopal-apk
          path: build-artifacts/nss-vit-bhopal.apk

      - name: Create or Update GitHub Release with Direct APK Download
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v1.0.0
          name: NSS VIT Bhopal Official Android App v1.0.0
          draft: false
          prerelease: false
          overwrite: true
          files: build-artifacts/nss-vit-bhopal.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
