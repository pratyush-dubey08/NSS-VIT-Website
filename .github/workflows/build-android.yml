name: Build Android APK & App Bundle

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android App (APK & AAB)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm install --legacy-peer-deps

      - name: Grant execute permission for gradlew
        working-directory: frontend/android
        run: chmod +x gradlew

      - name: Build Debug APK
        working-directory: frontend/android
        run: ./gradlew assembleDebug --stacktrace

      - name: Prepare Artifacts
        run: |
          mkdir -p build-artifacts
          cp frontend/android/app/build/outputs/apk/debug/app-debug.apk build-artifacts/nss-vit-bhopal.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nss-vit-bhopal-apk
          path: build-artifacts/nss-vit-bhopal.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v1.0.0
          name: NSS VIT Bhopal Official Android App v1.0.0
          draft: false
          prerelease: false
          files: build-artifacts/nss-vit-bhopal.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
